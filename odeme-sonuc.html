  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödeme Sonucu — VoxoMix</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://voxomix.com/odeme-sonuc">
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="/assets/analytics.js?v=4"></script>
  <link rel="icon" href="/assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <img class="brand-mark brand-light" src="/assets/logo-yatay.svg" alt="VoxoMix" width="111" height="26">
    <img class="brand-mark brand-dark" src="/assets/logo-yatay-koyu.svg" alt="VoxoMix" width="111" height="26">
  </a>
</nav>

<div class="section" style="padding-top:120px; text-align:center; min-height:50vh;">
  <div id="result-icon" style="font-size:64px; margin-bottom:24px;"></div>
  <h1 id="result-title" style="margin-bottom:16px;"></h1>
  <p id="result-desc" style="color:var(--muted); max-width:480px; margin:0 auto;"></p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  // plan URL'den gelir, yani ziyaretçi uydurabilir. Bilinen plan adlarının
  // dışındaki hiçbir değeri ekrana yazmıyoruz: aksi hâlde resmî alan adında
  // "Planınız <istediğin metin> oldu" diye ikna edici bir sahte onay üretilebilir.
  const GECERLI_PLANLAR = ['basic', 'student', 'producer'];
  const planHam = (params.get('plan') || '').toLowerCase().trim();
  const plan = GECERLI_PLANLAR.includes(planHam) ? planHam : null;
  const iconEl = document.getElementById('result-icon');
  const titleEl = document.getElementById('result-title');
  const descEl = document.getElementById('result-desc');

  if (status === 'success') {
    iconEl.textContent = '✅';
    titleEl.textContent = 'Ödeme başarılı!';
    descEl.textContent = (plan ? 'Planınız ' + plan.toUpperCase() + ' olarak güncellendi. ' : '') + 'VoxoMix uygulamasına dönüp tekrar açtığınızda yeni planınız aktif olacak.';
  } else if (status === 'failed') {
    iconEl.textContent = '⚠️';
    titleEl.textContent = 'Ödeme tamamlanamadı';
    descEl.textContent = 'Kartınızdan çekim yapılmadı. Lütfen uygulamadan tekrar deneyin.';
  } else {
    iconEl.textContent = '⚠️';
    titleEl.textContent = 'Bir sorun oluştu';
    descEl.textContent = 'Ödeme durumu doğrulanamadı. Lütfen destek ile iletişime geçin: info@voxomix.com';
  }
</script>

</body>
</html>
