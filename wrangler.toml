name = "voxomix-web"
main = "worker/index.js"
# Statik varlık + Worker birlikte çalışabilmesi için 2024 sonrası bir tarih gerekiyor
# (eski değer 2024-06-19 idi ve yalnız statik sunum için kullanılıyordu).
compatibility_date = "2025-01-01"

[assets]
directory = "."
binding = "ASSETS"
# ⚠️ 10.11.2026'da DEĞİŞTİ: eskiden varsayılan davranış vardı (istek statik
# dosyayla eşleşiyorsa Worker hiç çalışmazdı). Bu yüzden Worker'a eklenen
# http→https yönlendirmesi HTML sayfalarında hiç tetiklenmedi: /gizlilik düz
# HTTP üzerinden 200 dönmeye devam etti. Artık her istek önce Worker'dan
# geçiyor; Worker şemayı denetledikten sonra env.ASSETS.fetch(request) ile
# dosyayı sunuyor, yani _headers ve statik sunum davranışı aynı kalıyor.
run_worker_first = true

# İndirme sayacı (2026-08-08'de oluşturuldu). Anahtar biçimi: dl:YYYY-MM-DD:os:surum
# Okumak için:  npx wrangler kv key list --binding DOWNLOADS --remote
#               npx wrangler kv key get "dl:2026-08-09:mac:1.3.2" --binding DOWNLOADS --remote
# Binding kaldırılırsa Worker sayım yapmadan normal çalışmaya devam eder.
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "aa11906113ab46849176e16f217ef898"
